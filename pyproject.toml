[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "document-chunker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.2",
]

[project.scripts]
chunk = "src.document_chunker.main:main"
compare-strategies = "src.document_chunker.compare_strategies:main"

[tool.uv]
package = true